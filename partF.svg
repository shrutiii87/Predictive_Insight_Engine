  </text>

  <text x="1000"
        y="356"
        fill="#8FB7C9"
        font-family="Arial"
        font-size="9">
    NON-LINEAR
  </text>


  <!-- ================================================= -->
  <!-- MOVING SCAN LINE -->
  <!-- ================================================= -->

  <rect x="650"
        y="55"
        width="2"
        height="305"
        fill="#5DEAFF"
        opacity="0.10">

    <animate
      attributeName="x"
      values="650;1125;650"
      dur="6s"
      repeatCount="indefinite"/>
  </rect>


  <!-- ================================================= -->
  <!-- FRAME -->
  <!-- ================================================= -->

  <rect x="1"
        y="1"
        width="1198"
        height="418"
        rx="23"
        stroke="#168FC4"
        stroke-opacity="0.35"/>

</svg>
