<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- BACKGROUND -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#020B1C"/>
      <stop offset="0.5" stop-color="#041428"/>
      <stop offset="1" stop-color="#06243D"/>
    </linearGradient>

    <!-- CARD -->
    <linearGradient id="card" x1="730" y1="60" x2="1130" y2="360"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#06243D"/>
      <stop offset="1" stop-color="#073B5C"/>
    </linearGradient>

    <!-- CYAN -->
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5DEAFF"/>
      <stop offset="1" stop-color="#168FC4"/>
    </linearGradient>

    <!-- POLYNOMIAL -->
    <linearGradient id="poly" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#168FC4"/>
      <stop offset="0.45" stop-color="#5DEAFF"/>
      <stop offset="0.75" stop-color="#3BE38A"/>
      <stop offset="1" stop-color="#5DEAFF"/>
    </linearGradient>

    <!-- GRID -->
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36"
            stroke="#5DEAFF"
            stroke-opacity="0.055"/>
    </pattern>

    <!-- GLOW -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>

  <rect width="1200" height="420" rx="24" fill="url(#grid)">
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="36 36"
      dur="8s"
      repeatCount="indefinite"/>
  </rect>

  <ellipse cx="960" cy="210"
           rx="260"
           ry="175"
           fill="#168FC4"
           opacity="0.06"
           filter="url(#softGlow)">
    <animate
      attributeName="opacity"
      values="0.04;0.10;0.04"
      dur="4s"
      repeatCount="indefinite"/>
  </ellipse>


  <!-- ================================================= -->
  <!-- LEFT CONTENT -->
  <!-- ================================================= -->

  <text x="70" y="82"
        fill="#5DEAFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        letter-spacing="3">
    PART F
  </text>

  <text x="70" y="125"
        fill="white"
        font-family="Arial, Helvetica, sans-serif"
        font-size="34"
        font-weight="700">
    Polynomial Regression
  </text>

  <text x="70" y="155"
        fill="#8FB7C9"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16">
    Modeling Non-Linear Relationships
  </text>

  <text x="70" y="190"
        fill="#A9C4D2"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    Capturing curved relationships by
  </text>

  <text x="70" y="212"
        fill="#A9C4D2"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    transforming features into polynomial terms
  </text>


  <!-- ================================================= -->
  <!-- POLYNOMIAL PIPELINE -->
  <!-- ================================================= -->

  <rect x="65" y="245"
        width="500"
        height="95"
        rx="14"
        fill="#061B30"
        stroke="#168FC4"
        stroke-opacity="0.35"/>

  <text x="85" y="270"
        fill="#5DEAFF"
        font-family="Arial"
        font-size="10"
        font-weight="700"
        letter-spacing="2">
    POLYNOMIAL PIPELINE
  </text>


  <!-- PIPELINE LINE -->

  <path d="M105 304 H520"
        stroke="#168FC4"
        stroke-opacity="0.25"
        stroke-width="2"/>

  <path d="M105 304 H520"
        stroke="url(#poly)"
        stroke-width="2"
        stroke-dasharray="45 370"
        stroke-linecap="round">

    <animate
      attributeName="stroke-dashoffset"
      from="0"
      to="-415"
      dur="2.8s"
      repeatCount="indefinite"/>
  </path>


  <!-- NODES -->

  <circle cx="110" cy="304"
          r="7"
          fill="#06243D"
          stroke="#5DEAFF"
          stroke-width="2">

    <animate
      attributeName="r"
      values="7;10;7"
      dur="2s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="245" cy="304"
          r="7"
          fill="#06243D"
          stroke="#5DEAFF"
          stroke-width="2">

    <animate
      attributeName="r"
      values="7;10;7"
      dur="2s"
      begin="0.4s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="380" cy="304"
          r="7"
          fill="#06243D"
          stroke="#5DEAFF"
          stroke-width="2">

    <animate
      attributeName="r"
      values="7;10;7"
      dur="2s"
      begin="0.8s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="515" cy="304"
          r="7"
          fill="#06243D"
          stroke="#3BE38A"
          stroke-width="2">

    <animate
      attributeName="r"
      values="7;10;7"
      dur="2s"
      begin="1.2s"
      repeatCount="indefinite"/>
  </circle>


  <!-- LABELS -->

  <text x="90" y="326"
        fill="#9BBAC8"
        font-family="Arial"
        font-size="10">
    INPUT X
  </text>

  <text x="220" y="326"
        fill="#9BBAC8"
        font-family="Arial"
        font-size="10">
    X² TERMS
  </text>

  <text x="355" y="326"
        fill="#9BBAC8"
        font-family="Arial"
        font-size="10">
    FIT CURVE
  </text>

  <text x="487" y="326"
        fill="#3BE38A"
        font-family="Arial"
        font-size="10"
        font-weight="700">
    PREDICT
  </text>


  <!-- ================================================= -->
  <!-- LEGEND -->
  <!-- ================================================= -->

  <circle cx="82" cy="375" r="5" fill="#5DEAFF"/>

  <text x="95" y="379"
        fill="#8FAFBE"
        font-family="Arial"
        font-size="10">
    OBSERVED DATA
  </text>

  <circle cx="210" cy="375" r="5" fill="#3BE38A"/>

  <text x="223" y="379"
        fill="#8FAFBE"
        font-family="Arial"
        font-size="10">
    POLYNOMIAL FIT
  </text>

  <circle cx="350" cy="375" r="5" fill="#168FC4"/>

  <text x="363" y="379"
        fill="#8FAFBE"
        font-family="Arial"
        font-size="10">
    PREDICTION
  </text>


  <!-- ================================================= -->
  <!-- RIGHT CARD -->
  <!-- ================================================= -->

  <rect x="625"
        y="45"
        width="510"
        height="330"
        rx="20"
        fill="url(#card)"
        stroke="#168FC4"
        stroke-opacity="0.55"/>

  <rect x="625"
        y="45"
        width="510"
        height="330"
        rx="20"
        stroke="#5DEAFF"
        stroke-opacity="0.15"
        stroke-width="2">

    <animate
      attributeName="stroke-opacity"
      values="0.08;0.28;0.08"
      dur="3s"
      repeatCount="indefinite"/>
  </rect>


  <!-- ================================================= -->
  <!-- HEADER -->
  <!-- ================================================= -->

  <text x="655"
        y="78"
        fill="#5DEAFF"
        font-family="Arial"
        font-size="11"
        font-weight="700"
        letter-spacing="2">
    POLYNOMIAL MODEL
  </text>

  <text x="655"
        y="101"
        fill="white"
        font-family="Arial"
        font-size="15"
        font-weight="600">
    Non-Linear Fit Monitor
  </text>


  <!-- ================================================= -->
  <!-- EQUATION -->
  <!-- ================================================= -->

  <rect x="655"
        y="115"
        width="300"
        height="38"
        rx="9"
        fill="#04182A"
        stroke="#168FC4"
        stroke-opacity="0.35"/>

  <text x="672"
        y="139"
        fill="#5DEAFF"
        font-family="Arial"
        font-size="13"
        font-weight="700">
    ŷ = b₀ + b₁x + b₂x² + b₃x³
  </text>


  <!-- DEGREE -->

  <rect x="975"
        y="115"
        width="125"
        height="38"
        rx="9"
        fill="#04182A"
        stroke="#3BE38A"
        stroke-opacity="0.35"/>

  <text x="990"
        y="139"
        fill="#8FAFBE"
        font-family="Arial"
        font-size="9"
        font-weight="700">
    DEGREE
  </text>

  <text x="1055"
        y="139"
        fill="#3BE38A"
        font-family="Arial"
        font-size="13"
        font-weight="700">
    3
  </text>


  <!-- ================================================= -->
  <!-- GRAPH AREA -->
  <!-- ================================================= -->

  <rect x="655"
        y="170"
        width="445"
        height="160"
        rx="10"
        fill="#04182A"
        stroke="#168FC4"
        stroke-opacity="0.25"/>


  <!-- GRAPH GRID -->

  <path d="M685 200 H1070
           M685 230 H1070
           M685 260 H1070
           M685 290 H1070
           M685 320 H1070"
        stroke="#5DEAFF"
        stroke-opacity="0.07"/>

  <path d="M725 185 V320
           M775 185 V320
           M825 185 V320
           M875 185 V320
           M925 185 V320
           M975 185 V320
           M1025 185 V320"
        stroke="#5DEAFF"
        stroke-opacity="0.07"/>


  <!-- AXES -->

  <path d="M685 320 H1070"
        stroke="#8FB7C9"
        stroke-opacity="0.4"/>

  <path d="M685 320 V185"
        stroke="#8FB7C9"
        stroke-opacity="0.4"/>


  <!-- ================================================= -->
  <!-- POLYNOMIAL CURVE -->
  <!-- ================================================= -->

  <path d="M690 295
           C730 285 750 255 785 230
           C820 205 850 210 880 235
           C915 265 945 285 975 265
           C1010 240 1035 205 1065 195"
        fill="none"
        stroke="#168FC4"
        stroke-width="8"
        stroke-opacity="0.12"
        filter="url(#softGlow)"/>

  <path d="M690 295
           C730 285 750 255 785 230
           C820 205 850 210 880 235
           C915 265 945 285 975 265
           C1010 240 1035 205 1065 195"
        fill="none"
        stroke="url(#poly)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-dasharray="520"
        stroke-dashoffset="520">

    <animate
      attributeName="stroke-dashoffset"
      values="520;0;0;520"
      dur="6s"
      repeatCount="indefinite"/>
  </path>


  <!-- ================================================= -->
  <!-- OBSERVED DATA -->
  <!-- ================================================= -->

  <circle cx="720" cy="280" r="4"
          fill="#5DEAFF"
          filter="url(#glow)">
    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="2s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="760" cy="250" r="4"
          fill="#5DEAFF"
          filter="url(#glow)">
    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="2s"
      begin="0.25s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="810" cy="220" r="4"
          fill="#5DEAFF"
          filter="url(#glow)">
    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="2s"
      begin="0.5s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="855" cy="215" r="4"
          fill="#5DEAFF"
          filter="url(#glow)">
    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="2s"
      begin="0.75s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="900" cy="250" r="4"
          fill="#5DEAFF"
          filter="url(#glow)">
    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="2s"
      begin="1s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="950" cy="275" r="4"
          fill="#5DEAFF"
          filter="url(#glow)">
    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="2s"
      begin="1.25s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="1000" cy="245" r="4"
          fill="#3BE38A"
          filter="url(#glow)">
    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="2s"
      begin="1.5s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="1040" cy="215" r="4"
          fill="#3BE38A"
          filter="url(#glow)">
    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="2s"
      begin="1.75s"
      repeatCount="indefinite"/>
  </circle>


  <!-- ================================================= -->
  <!-- RESIDUAL LINES -->
  <!-- ================================================= -->

  <path d="M760 250 L760 242"
        stroke="#3BE38A"
        stroke-width="1"
        stroke-dasharray="3 3"
        opacity="0.7"/>

  <path d="M810 220 L810 228"
        stroke="#3BE38A"
        stroke-width="1"
        stroke-dasharray="3 3"
        opacity="0.7"/>

  <path d="M900 250 L900 242"
        stroke="#3BE38A"
        stroke-width="1"
        stroke-dasharray="3 3"
        opacity="0.7"/>

  <path d="M950 275 L950 268"
        stroke="#3BE38A"
        stroke-width="1"
        stroke-dasharray="3 3"
        opacity="0.7"/>


  <!-- ================================================= -->
  <!-- PREDICTION POINT -->
  <!-- ================================================= -->

  <circle cx="1000"
          cy="245"
          r="9"
          fill="none"
          stroke="#3BE38A"
          stroke-width="2"
          opacity="0.8">

    <animate
      attributeName="r"
      values="7;16;7"
      dur="2s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0.8;0;0.8"
      dur="2s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="1000"
          cy="245"
          r="5"
          fill="#3BE38A"
          filter="url(#glow)"/>


  <!-- ================================================= -->
  <!-- AXIS LABELS -->
  <!-- ================================================= -->

  <text x="1050"
        y="340"
        fill="#8FB7C9"
        font-family="Arial"
        font-size="9">
    X
  </text>

  <text x="670"
        y="190"
        fill="#8FB7C9"
        font-family="Arial"
        font-size="9">
    Y
  </text>


  <!-- ================================================= -->
  <!-- MODEL STATUS -->
  <!-- ================================================= -->

  <rect x="655"
        y="342"
        width="445"
        height="20"
        rx="6"
        fill="#04182A"/>

  <circle cx="670"
          cy="352"
          r="4"
          fill="#3BE38A"
          filter="url(#glow)">

    <animate
