<svg width="1200" height="420" viewBox="0 0 1200 420"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020B1C"/>
      <stop offset="55%" stop-color="#041428"/>
      <stop offset="100%" stop-color="#06243D"/>
    </linearGradient>

    <!-- Card -->
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06243D"/>
      <stop offset="100%" stop-color="#073B5C"/>
    </linearGradient>

    <!-- Cyan -->
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5DEAFF"/>
      <stop offset="100%" stop-color="#168FC4"/>
    </linearGradient>

    <!-- Reporting -->
    <linearGradient id="report" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#168FC4"/>
      <stop offset="45%" stop-color="#5DEAFF"/>
      <stop offset="100%" stop-color="#3BE38A"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="36" height="36"
             patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36"
            fill="none"
            stroke="#2BA8D4"
            stroke-opacity="0.10"
            stroke-width="1"/>
    </pattern>

  </defs>


  <!-- BACKGROUND -->
  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- Animated grid -->
  <rect width="1200" height="420" fill="url(#grid)">
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="36 36"
      dur="7s"
      repeatCount="indefinite"/>
  </rect>


  <!-- OUTER FRAME -->
  <rect x="1" y="1"
        width="1198"
        height="418"
        rx="23"
        fill="none"
        stroke="#168FC4"
        stroke-opacity="0.35"
        stroke-width="1.5"/>


  <!-- ================= LEFT SECTION ================= -->

  <text x="55" y="62"
        fill="#5DEAFF"
        font-family="Arial, sans-serif"
        font-size="14"
        font-weight="700"
        letter-spacing="3">
    PART I
  </text>

  <text x="55" y="102"
        fill="#FFFFFF"
        font-family="Arial, sans-serif"
        font-size="30"
        font-weight="700">
    Final Analysis &amp; Reporting
  </text>

  <text x="55" y="132"
        fill="#8DDCF0"
        font-family="Arial, sans-serif"
        font-size="15">
    Turning Model Results Into Insights
  </text>

  <text x="55" y="166"
        fill="#A8C7D5"
        font-family="Arial, sans-serif"
        font-size="12">
    Consolidate performance, diagnostics and findings
  </text>

  <text x="55" y="185"
        fill="#A8C7D5"
        font-family="Arial, sans-serif"
        font-size="12">
    into a clear, actionable final analysis.
  </text>


  <!-- REPORTING PIPELINE -->
  <rect x="48" y="215"
        width="520"
        height="116"
        rx="16"
        fill="#031629"
        stroke="#168FC4"
        stroke-opacity="0.45"/>

  <text x="70" y="241"
        fill="#5DEAFF"
        font-family="Arial, sans-serif"
        font-size="10"
        font-weight="700"
        letter-spacing="2">
    FINAL REPORTING PIPELINE
  </text>


  <!-- DATA -->
  <rect x="70" y="258"
        width="92"
        height="43"
        rx="10"
        fill="#06243D"
        stroke="#168FC4"
        stroke-opacity="0.7"/>

  <text x="116" y="276"
        text-anchor="middle"
        fill="#FFFFFF"
        font-family="Arial, sans-serif"
        font-size="11"
        font-weight="700">
    RESULTS
  </text>

  <text x="116" y="291"
        text-anchor="middle"
        fill="#6EDBF2"
        font-family="Arial, sans-serif"
        font-size="9">
    COLLECT
  </text>


  <!-- Arrow -->
  <path d="M162 280H188"
        stroke="#3BE38A"
        stroke-width="2"
        stroke-dasharray="5 5">
    <animate
      attributeName="stroke-dashoffset"
      from="20"
      to="0"
      dur="0.8s"
      repeatCount="indefinite"/>
  </path>


  <!-- ANALYZE -->
  <rect x="188" y="258"
        width="92"
        height="43"
        rx="10"
        fill="#06243D"
        stroke="#168FC4"
        stroke-opacity="0.7"/>

  <text x="234" y="276"
        text-anchor="middle"
        fill="#FFFFFF"
        font-family="Arial, sans-serif"
        font-size="11"
        font-weight="700">
    ANALYZE
  </text>

  <text x="234" y="291"
        text-anchor="middle"
        fill="#6EDBF2"
        font-family="Arial, sans-serif"
        font-size="9">
    PATTERNS
  </text>


  <!-- Arrow -->
  <path d="M280 280H306"
        stroke="#3BE38A"
        stroke-width="2"
        stroke-dasharray="5 5">
    <animate
      attributeName="stroke-dashoffset"
      from="20"
      to="0"
      dur="0.8s"
      repeatCount="indefinite"/>
  </path>


  <!-- INSIGHTS -->
  <rect x="306" y="258"
        width="92"
        height="43"
        rx="10"
        fill="#06243D"
        stroke="#168FC4"
        stroke-opacity="0.7"/>

  <text x="352" y="276"
        text-anchor="middle"
        fill="#FFFFFF"
        font-family="Arial, sans-serif"
        font-size="11"
        font-weight="700">
    INSIGHTS
  </text>

  <text x="352" y="291"
        text-anchor="middle"
        fill="#6EDBF2"
        font-family="Arial, sans-serif"
        font-size="9">
    EXTRACT
  </text>


  <!-- Arrow -->
  <path d="M398 280H424"
        stroke="#3BE38A"
        stroke-width="2"
        stroke-dasharray="5 5">
    <animate
      attributeName="stroke-dashoffset"
      from="20"
      to="0"
      dur="0.8s"
      repeatCount="indefinite"/>
  </path>


  <!-- REPORT -->
  <rect x="424" y="258"
        width="116"
        height="43"
        rx="10"
        fill="#06243D"
        stroke="#3BE38A"
        stroke-opacity="0.8"/>

  <text x="482" y="276"
        text-anchor="middle"
        fill="#FFFFFF"
        font-family="Arial, sans-serif"
        font-size="11"
        font-weight="700">
    REPORT
  </text>

  <text x="482" y="291"
        text-anchor="middle"
        fill="#3BE38A"
        font-family="Arial, sans-serif"
        font-size="9">
    DECISION READY
  </text>


  <!-- LEGEND -->
  <circle cx="68" cy="354" r="5" fill="#168FC4"/>

  <text x="80" y="358"
        fill="#91C8D9"
        font-family="Arial, sans-serif"
        font-size="10">
    PERFORMANCE
  </text>

  <circle cx="184" cy="354" r="5" fill="#5DEAFF"/>

  <text x="196" y="358"
        fill="#91C8D9"
        font-family="Arial, sans-serif"
        font-size="10">
    INSIGHTS
  </text>

  <circle cx="278" cy="354" r="5" fill="#3BE38A"/>

  <text x="290" y="358"
        fill="#91C8D9"
        font-family="Arial, sans-serif"
        font-size="10">
    FINAL REPORT
  </text>


  <!-- ================= RIGHT REPORT MONITOR ================= -->

  <rect x="625" y="45"
        width="510"
        height="330"
        rx="20"
        fill="url(#card)"
        stroke="#168FC4"
        stroke-opacity="0.65"
        stroke-width="1.5"/>


  <!-- Header -->
  <text x="650" y="75"
        fill="#5DEAFF"
        font-family="Arial, sans-serif"
        font-size="11"
        font-weight="700"
        letter-spacing="2">
    FINAL ANALYSIS
  </text>

  <text x="650" y="96"
        fill="#FFFFFF"
        font-family="Arial, sans-serif"
        font-size="14"
        font-weight="700">
    Model Performance Report
  </text>


  <!-- Status -->
  <circle cx="1082" cy="72"
          r="5"
          fill="#3BE38A"
          filter="url(#glow)">
    <animate
      attributeName="r"
      values="4;7;4"
      dur="1.6s"
      repeatCount="indefinite"/>
  </circle>

  <text x="1003" y="96"
        fill="#8EEFC1"
        font-family="Arial, sans-serif"
        font-size="9"
        font-weight="700">
    REPORT COMPLETE
  </text>


  <!-- MAIN DASHBOARD -->
  <rect x="650" y="115"
        width="450"
        height="200"
        rx="12"
        fill="#021426"
        stroke="#168FC4"
        stroke-opacity="0.45"/>


  <!-- PERFORMANCE BARS -->

  <text x="670" y="140"
        fill="#6D9EB0"
        font-family="Arial, sans-serif"
        font-size="8"
        font-weight="700">
    MODEL PERFORMANCE
  </text>


  <!-- R2 -->
  <text x="670" y="160"
        fill="#A8C7D5"
        font-family="Arial, sans-serif"
        font-size="9">
    R² SCORE
  </text>

  <rect x="750" y="151"
        width="190"
        height="9"
        rx="5"
        fill="#082A43"/>

  <rect x="750" y="151"
        width="165"
        height="9"
        rx="5"
        fill="url(#report)">
    <animate
      attributeName="width"
      values="0;165"
      dur="1.5s"
      fill="freeze"/>
  </rect>

  <text x="955" y="160"
        fill="#5DEAFF"
        font-family="Arial, sans-serif"
        font-size="9"
        font-weight="700">
    0.912
  </text>


  <!-- MAE -->
  <text x="670" y="187"
        fill="#A8C7D5"
        font-family="Arial, sans-serif"
        font-size="9">
    MAE
  </text>

  <rect x="750" y="178"
        width="190"
        height="9"
        rx="5"
        fill="#082A43"/>

  <rect x="750" y="178"
        width="142"
        height="9"
        rx="5"
        fill="url(#report)">
    <animate
      attributeName="width"
      values="0;142"
      dur="1.5s"
      begin="0.3s"
      fill="freeze"/>
  </rect>

  <text x="955" y="187"
        fill="#5DEAFF"
        font-family="Arial, sans-serif"
        font-size="9"
        font-weight="700">
    2.41
  </text>


  <!-- RMSE -->
  <text x="670" y="214"
        fill="#A8C7D5"
        font-family="Arial, sans-serif"
        font-size="9">
    RMSE
  </text>

  <rect x="750" y="205"
        width="190"
        height="9"
        rx="5"
        fill="#082A43"/>

  <rect x="750" y="205"
        width="128"
        height="9"
        rx="5"
        fill="url(#report)">
    <animate
      attributeName="width"
      values="0;128"
      dur="1.5s"
      begin="0.6s"
      fill="freeze"/>
  </rect>

  <text x="955" y="214"
        fill="#5DEAFF"
        font-family="Arial, sans-serif"
        font-size="9"
        font-weight="700">
    2.96
  </text>


  <!-- MODEL STATUS -->
  <text x="670" y="244"
        fill="#6D9EB0"
        font-family="Arial, sans-serif"
        font-size="8"
        font-weight="700">
    FINAL DIAGNOSTIC
  </text>


  <rect x="670" y="253"
        width="120"
        height="38"
        rx="9"
        fill="#06243D"
        stroke="#168FC4"
        stroke-opacity="0.4"/>

  <circle cx="687" cy="272"
          r="5"
          fill="#3BE38A"
          filter="url(#glow)">
    <animate
      attributeName="r"
      values="4;7;4"
      dur="1.5s"
      repeatCount="indefinite"/>
  </circle>

  <text x="700" y="269"
        fill="#FFFFFF"
        font-family="Arial, sans-serif"
        font-size="9"
        font-weight="700">
    GOOD FIT
  </text>

  <text x="700" y="282"
        fill="#75CFA7"
        font-family="Arial, sans-serif"
        font-size="7">
    GENERALIZES WELL
  </text>


  <!-- INSIGHT CARD -->
  <rect x="805" y="253"
        width="135"
        height="38"
        rx="9"
        fill="#06243D"
        stroke="#5DEAFF"
        stroke-opacity="0.35"/>

  <text x="818" y="269"
        fill="#6D9EB0"
        font-family="Arial, sans-serif"
        font-size="7">
    KEY INSIGHT
  </text>

  <text x="818" y="282"
        fill="#5DEAFF"
        font-family="Arial, sans-serif"
        font-size="9"
        font-weight="700">
    LOW ERROR
  </text>


  <!-- FINAL REPORT CARD -->
  <rect x="955" y="253"
        width="125"
        height="38"
        rx="9"
        fill="#06243D"
        stroke="#3BE38A"
        stroke-opacity="0.5"/>

  <text x="968" y="269"
        fill="#6D9EB0"
        font-family="Arial, sans-serif"
        font-size="7">
    DECISION
  </text>

  <text x="968" y="282"
        fill="#8EEFC1"
        font-family="Arial, sans-serif"
        font-size="9"
        font-weight="700">
    READY ✓
  </text>


  <!-- Animated report scan -->
  <rect x="670" y="125"
        width="2"
        height="175"
        fill="#5DEAFF"
        opacity="0.4"
        filter="url(#softGlow)">
    <animate
      attributeName="x"
      from="670"
      to="1080"
      dur="4s"
      repeatCount="indefinite"/>
  </rect>


  <!-- Bottom completion line -->
  <path d="M650 337H1100"
        stroke="#168FC4"
        stroke-opacity="0.25"/>

  <circle cx="670" cy="350"
          r="4"
          fill="#3BE38A"
          filter="url(#glow)"/>

  <text x="683" y="354"
        fill="#8EEFC1"
        font-family="Arial, sans-serif"
        font-size="9"
        font-weight="700">
    ANALYSIS COMPLETE
  </text>

  <text x="1000" y="354"
        fill="#6D9EB0"
        font-family="Arial, sans-serif"
        font-size="8">
    MODEL → INSIGHT → DECISION
  </text>


  <!-- Animated completion pulse -->
  <circle cx="1070" cy="350"
          r="5"
          fill="none"
          stroke="#3BE38A"
          stroke-width="1">
    <animate
      attributeName="r"
      values="5;16;5"
      dur="2s"
      repeatCount="indefinite"/>

    <animate
      attributeName="stroke-opacity"
      values="0.8;0;0.8"
      dur="2s"
      repeatCount="indefinite"/>
  </circle>

</svg>
