<svg width="1200" height="420" viewBox="0 0 1200 420"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- BACKGROUND -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020B1C"/>
      <stop offset="55%" stop-color="#041428"/>
      <stop offset="100%" stop-color="#06243D"/>
    </linearGradient>

    <!-- CARD -->
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06243D"/>
      <stop offset="100%" stop-color="#073B5C"/>
    </linearGradient>

    <!-- CYAN -->
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#168FC4"/>
      <stop offset="100%" stop-color="#5DEAFF"/>
    </linearGradient>

    <!-- FINAL GRADIENT -->
    <linearGradient id="final" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#168FC4"/>
      <stop offset="50%" stop-color="#5DEAFF"/>
      <stop offset="100%" stop-color="#3BE38A"/>
    </linearGradient>

    <!-- GLOW -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- GRID -->
    <pattern id="grid"
             width="36"
             height="36"
             patternUnits="userSpaceOnUse">

      <path d="M36 0H0V36"
            fill="none"
            stroke="#2BA8D4"
            stroke-opacity="0.10"
            stroke-width="1"/>
    </pattern>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1200"
        height="420"
        fill="url(#bg)"/>

  <!-- Moving grid -->
  <rect width="1200"
        height="420"
        fill="url(#grid)">

    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="36 36"
      dur="7s"
      repeatCount="indefinite"/>
  </rect>


  <!-- OUTER FRAME -->

  <rect x="1"
        y="1"
        width="1198"
        height="418"
        rx="23"
        fill="none"
        stroke="#168FC4"
        stroke-opacity="0.35"
        stroke-width="1.5"/>


  <!-- ================================================= -->
  <!-- LEFT CONTENT -->
  <!-- ================================================= -->

  <text x="55"
        y="62"
        fill="#5DEAFF"
        font-family="Arial, sans-serif"
        font-size="14"
        font-weight="700"
        letter-spacing="3">
