<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020B1C"/>
      <stop offset="0.55" stop-color="#041428"/>
      <stop offset="1" stop-color="#06243D"/>
    </linearGradient>

    <!-- Card -->
    <linearGradient id="card" x1="740" y1="40" x2="1150" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06243D"/>
      <stop offset="1" stop-color="#073B5C"/>
    </linearGradient>

    <!-- Cyan -->
    <linearGradient id="cyan" x1="60" y1="60" x2="500" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5DEAFF"/>
      <stop offset="1" stop-color="#168FC4"/>
    </linearGradient>

    <!-- Shine -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5DEAFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5DEAFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5DEAFF" stop-opacity="0"/>

      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        values="-1 0;1 0;1 0"
        dur="4s"
        repeatCount="indefinite"/>
    </linearGradient>

    <!-- Radar -->
    <radialGradient id="radar" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0B6388" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#020B1C" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Sweep -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5DEAFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5DEAFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path
        d="M40 0H0V40"
        stroke="#0B6388"
        stroke-opacity="0.12"
        stroke-width="1"/>
    </pattern>

    <!-- Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frameClip">
      <rect width="1200" height="420" rx="24"/>
    </clipPath>

  </defs>


  <!-- BACKGROUND -->

  <rect
    width="1200"
    height="420"
    rx="24"
    fill="url(#bg)"/>

  <g clip-path="url(#frameClip)">
    <g>
      <rect
        width="1200"
        height="460"
        fill="url(#grid)"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 -40"
        dur="8s"
        repeatCount="indefinite"/>
    </g>
  </g>

  <rect
    x="0.5"
    y="0.5"
    width="1199"
    height="419"
    rx="24"
    stroke="#073B5C"/>


  <!-- LEFT TITLE BLOCK -->

  <g opacity="0">

    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.7s"
      begin="0.1s"
      fill="freeze"/>

    <rect
      x="60"
      y="44"
      width="46"
      height="5"
      rx="2.5"
      fill="#5DEAFF">

      <animate
        attributeName="width"
        values="0;46"
        dur="0.8s"
        begin="0.1s"
        fill="freeze"/>

    </rect>

    <text
      x="60"
      y="96"
      font-family="Helvetica, Arial, sans-serif"
      font-size="42"
      font-weight="700"
      fill="#FFFFFF"
      letter-spacing="-1">
      Dataset Understanding
    </text>

  </g>


  <!-- SUBTITLE -->

  <g opacity="0">

    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.7s"
      begin="0.5s"
      fill="freeze"/>

    <text
      x="60"
      y="132"
      font-family="Helvetica, Arial, sans-serif"
      font-size="22"
      font-weight="700"
      fill="url(#cyan)">
      &amp; Preparation
    </text>

    <text
      x="60"
      y="160"
      font-family="Helvetica, Arial, sans-serif"
      font-size="13"
      fill="#5B7A94">
      Understand structure, quality, patterns &amp; readiness
    </text>

  </g>


  <!-- DATASET STATUS CARD -->

  <g opacity="0">

    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.7s"
      begin="0.9s"
      fill="freeze"/>

    <rect
      x="60"
      y="218"
      width="600"
      height="130"
      rx="18"
      fill="#06243D"
      fill-opacity="0.6"
      stroke="#0B6388"
      stroke-opacity="0.5"/>


    <text
      x="82"
      y="244"
      font-family="Helvetica, Arial, sans-serif"
      font-size="10"
      fill="#5B7A94"
      letter-spacing="2">
      DATASET PREPARATION
    </text>


    <!-- Connecting Line -->

    <line
      x1="100"
      y1="290"
      x2="610"
      y2="290"
      stroke="#0B6388"
      stroke-width="3"/>


    <line
      x1="100"
      y1="290"
      x2="610"
      y2="290"
      stroke="#5DEAFF"
      stroke-width="3"
      stroke-opacity="0.8"
      stroke-dasharray="510"
      stroke-dashoffset="510">

      <animate
        attributeName="stroke-dashoffset"
        values="510;0"
        dur="3s"
        begin="1.1s"
        fill="freeze"/>

    </line>


    <!-- Travelling Pulse -->

    <circle
      cy="290"
      r="5"
      fill="#FFFFFF"
      filter="url(#glow)">

      <animate
        attributeName="cx"
        values="100;610"
        dur="3s"
        begin="1.1s"
        fill="freeze"/>

      <animate
        attributeName="cx"
        values="100;610"
        dur="3s"
        begin="8s"
        repeatCount="indefinite"/>

    </circle>


    <!-- STEP CIRCLES -->

    <g
      fill="none"
      stroke="#5DEAFF"
      stroke-width="2">

      <circle
        cx="100"
        cy="290"
        r="16"
        fill="#020B1C"/>

      <circle
        cx="270"
        cy="290"
        r="16"
        fill="#020B1C"/>

      <circle
        cx="440"
        cy="290"
        r="16"
        fill="#020B1C"/>

      <circle
        cx="610"
        cy="290"
        r="18"
        fill="#020B1C"
        stroke="#3BE38A">

        <animate
          attributeName="stroke-opacity"
          values="1;0.35;1"
          dur="2s"
          begin="4.1s"
          repeatCount="indefinite"/>

      </circle>

    </g>


    <!-- STEP ICONS -->

    <!-- Dataset -->
    <rect
      x="92"
      y="282"
      width="16"
      height="12"
      rx="2"
      fill="#5DEAFF"/>

    <line
      x1="95"
      y1="286"
      x2="105"
      y2="286"
      stroke="#020B1C"
      stroke-width="1"/>

    <line
      x1="95"
      y1="290"
      x2="105"
      y2="290"
      stroke="#020B1C"
      stroke-width="1"/>


    <!-- Check -->
    <path
      d="M263 290l5 5 10-11"
      stroke="#5DEAFF"
      stroke-width="2.2"
      fill="none"
      stroke-linecap="round"
      stroke-dasharray="24"
      stroke-dashoffset="24">

      <animate
        attributeName="stroke-dashoffset"
        values="24;0"
        dur="0.4s"
        begin="1.7s"
        fill="freeze"/>

    </path>


    <!-- Quality -->
    <path
      d="M432 294l5-9 5 6 4-7"
      stroke="#5DEAFF"
      stroke-width="2.2"
      fill="none"
      stroke-linecap="round"
      stroke-dasharray="30"
      stroke-dashoffset="30">

      <animate
        attributeName="stroke-dashoffset"
        values="30;0"
        dur="0.4s"
        begin="2.7s"
        fill="freeze"/>

    </path>


    <!-- Ready -->
    <path
      d="M602 290l5 6 11-12"
      stroke="#3BE38A"
      stroke-width="2.4"
      fill="none"
      stroke-linecap="round"
      stroke-dasharray="26"
      stroke-dashoffset="26">

      <animate
        attributeName="stroke-dashoffset"
        values="26;0"
        dur="0.4s"
        begin="4s"
        fill="freeze"/>

    </path>


    <!-- Labels -->

    <g
      font-family="Helvetica, Arial, sans-serif"
      font-size="10"
      fill="#8FA9BE"
      text-anchor="middle"
      letter-spacing="1">

      <text x="100" y="326">
        UNDERSTAND
      </text>

      <text x="270" y="326">
        INSPECT
      </text>

      <text x="440" y="326">
        PREPARE
      </text>

      <text x="610" y="326">
        READY
      </text>

    </g>

  </g>


  <!-- LEGEND -->

  <g
    font-family="Helvetica, Arial, sans-serif"
    font-size="10"
    letter-spacing="1"
    opacity="0">

    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.6s"
      begin="1.4s"
      fill="freeze"/>


    <circle
      cx="64"
      cy="374"
      r="5"
      fill="#3BE38A">

      <animate
        attributeName="r"
        values="5;6.5;5"
        dur="2.4s"
        repeatCount="indefinite"/>

    </circle>

    <text
      x="78"
      y="378"
      fill="#8FA9BE">
      DATASET
    </text>


    <circle
      cx="170"
      cy="374"
      r="5"
      fill="#168FC4">

      <animate
        attributeName="r"
        values="5;6.5;5"
        dur="2.4s"
        begin="0.6s"
        repeatCount="indefinite"/>

    </circle>

    <text
      x="184"
      y="378"
      fill="#8FA9BE">
      DATA QUALITY
    </text>


    <circle
      cx="318"
      cy="374"
      r="5"
      fill="#A8E63B">

      <animate
        attributeName="r"
        values="5;6.5;5"
        dur="2.4s"
        begin="1.2s"
        repeatCount="indefinite"/>

    </circle>

    <text
      x="332"
      y="378"
      fill="#8FA9BE">
      FEATURE READINESS
    </text>

  </g>


  <!-- SPARK ICON -->

  <circle
    cx="682"
    cy="78"
    r="18"
    fill="none"
    stroke="#0B6388"/>

  <g>

    <path
      d="M682 66l3.5 8.5L694 78l-8.5 3.5L682 90l-3.5-8.5L670 78l8.5-3.5z"
      fill="#5DEAFF"
      filter="url(#glow)"/>

    <animateTransform
      attributeName="transform"
      type="rotate"
      values="0 682 78;180 682 78;360 682 78"
      dur="9s"
      repeatCount="indefinite"/>

  </g>


  <!-- RIGHT DATA PROFILE CARD -->

  <g opacity="0">

    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.8s"
      begin="0.6s"
      fill="freeze"/>


    <rect
      x="740"
      y="44"
      width="410"
      height="308"
      rx="20"
      fill="url(#card)"
      stroke="#0B6388"
      stroke-opacity="0.6"/>


    <rect
      x="740"
      y="44"
      width="410"
      height="308"
      rx="20"
      fill="url(#shine)"
      opacity="0.35"/>


    <text
      x="762"
      y="78"
      font-family="Helvetica, Arial, sans-serif"
      font-size="10"
      fill="#5B7A94"
      letter-spacing="2">
      DATA PROFILE
    </text>


    <text
      x="762"
      y="102"
      font-family="Helvetica, Arial, sans-serif"
      font-size="14"
      fill="#E8F4FA">
      Dataset structure verification
    </text>


    <!-- DATA SCANNER -->

    <g transform="translate(870 216)">

      <circle
        r="82"
        fill="url(#radar)"
        stroke="#0B6388"
        stroke-opacity="0.6"/>

      <circle
        r="55"
        fill="none"
        stroke="#0B6388"
        stroke-opacity="0.45"/>

      <circle
        r="28"
        fill="none"
        stroke="#0B6388"
        stroke-opacity="0.45"/>


      <line
        x1="-82"
        y1="0"
        x2="82"
        y2="0"
        stroke="#0B6388"
        stroke-opacity="0.35"/>

      <line
        x1="0"
        y1="-82"
        x2="0"
        y2="82"
        stroke="#0B6388"
        stroke-opacity="0.35"/>


      <!-- Expanding Rings -->

      <circle
        r="10"
        fill="none"
        stroke="#5DEAFF"
        stroke-width="1.5">

        <animate
          attributeName="r"
          values="8;82"
          dur="3s"
          repeatCount="indefinite"/>

        <animate
          attributeName="stroke-opacity"
          values="0.6;0"
          dur="3s"
          repeatCount="indefinite"/>

      </circle>


      <circle
        r="10"
        fill="none"
        stroke="#5DEAFF"
        stroke-width="1.5">

        <animate
          attributeName="r"
          values="8;82"
          dur="3s"
          begin="1.5s"
          repeatCount="indefinite"/>

        <animate
          attributeName="stroke-opacity"
          values="0.6;0"
          dur="3s"
          begin="1.5s"
          repeatCount="indefinite"/>

      </circle>


      <!-- Rotating Scanner -->

      <g>

        <path
          d="M0 0 L-80 -18 A82 82 0 0 1 -58 -58 Z"
          fill="url(#sweep)"/>

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="6s"
          repeatCount="indefinite"/>

      </g>


      <!-- Center -->

      <circle
        r="9"
        fill="#5DEAFF"
        filter="url(#glow)">

        <animate
          attributeName="r"
          values="9;11;9"
          dur="2s"
          repeatCount="indefinite"/>

      </circle>


      <!-- Data Points -->

      <circle
        cx="46"
        cy="-32"
        r="5"
        fill="#3BE38A">

        <animate
          attributeName="opacity"
          values="0.3;1;0.3"
          dur="3s"
          begin="0.4s"
          repeatCount="indefinite"/>

      </circle>


      <circle
        cx="-52"
        cy="10"
        r="4"
        fill="#168FC4">

        <animate
          attributeName="opacity"
          values="0.3;1;0.3"
          dur="3s"
          begin="1.6s"
          repeatCount="indefinite"/>

      </circle>


      <circle
        cx="20"
        cy="52"
        r="9"
        fill="#A8E63B">

        <animate
          attributeName="opacity"
          values="0.35;1;0.35"
          dur="3s"
          begin="2.4s"
          repeatCount="indefinite"/>

      </circle>

    </g>


    <!-- STAT PANEL -->

    <rect
      x="1002"
      y="146"
      width="124"
      height="126"
      rx="12"
      fill="#020B1C"
      fill-opacity="0.7"
      stroke="#0B6388"
      stroke-opacity="0.6"/>


    <text
      x="1018"
      y="164"
      font-family="Helvetica, Arial, sans-serif"
      font-size="8"
      fill="#5B7A94"
      letter-spacing="1.5">
      STATUS
    </text>


    <text
      x="1018"
      y="184"
      font-family="Helvetica, Arial, sans-serif"
      font-size="16"
      font-weight="700"
      fill="#3BE38A">

      READY

      <animate
        attributeName="fill-opacity"
        values="1;0.45;1"
        dur="2.6s"
        repeatCount="indefinite"/>

    </text>


    <text
      x="1018"
      y="212"
      font-family="Helvetica, Arial, sans-serif"
      font-size="8"
      fill="#5B7A94"
      letter-spacing="1.5">
      COLUMNS
    </text>


    <text
      x="1018"
      y="230"
      font-family="Helvetica, Arial, sans-serif"
      font-size="15"
      font-weight="700"
      fill="#FFFFFF">
      IDENTIFIED
    </text>


    <text
      x="1018"
      y="252"
      font-family="Helvetica, Arial, sans-serif"
      font-size="8"
      fill="#5B7A94"
      letter-spacing="1.5">
      QUALITY
    </text>


    <text
      x="1018"
      y="268"
      font-family="Helvetica, Arial, sans-serif"
      font-size="15"
      font-weight="700"
      fill="#5DEAFF">
      VERIFIED
    </text>

  </g>

</svg>
