<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" font-family="Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="10%" r="100%">
      <stop offset="0%" stop-color="#0d2137"/>
      <stop offset="60%" stop-color="#081527"/>
      <stop offset="100%" stop-color="#050c16"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#123043"/>
    </pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0f2438" stroke-width="1"/>
    </pattern>
    <style>
      .card{fill:#0b1f33;stroke:#1e3a52;stroke-width:1.5}
      .num{font-size:15px;font-weight:800;fill:#22d3ee}
      .h{font-size:19px;font-weight:800;fill:#e2e8f0}
      .t{font-size:13.5px;fill:#94a3b8}
      .chip{font-size:13px;font-weight:700;fill:#a5f3fc}
    </style>
  </defs>

  <rect width="1400" height="950" rx="24" fill="url(#bg)"/>
  <rect width="1400" height="950" rx="24" fill="url(#grid)"/>
  <rect width="1400" height="950" rx="24" fill="url(#dots)" opacity="0.5"/>

  <!-- ============ HEADER ============ -->
  <rect x="570" y="28" width="260" height="42" rx="21" fill="#0b1f33" stroke="#1e3a52"/>
  <text x="700" y="56" text-anchor="middle" font-size="18" font-weight="800" fill="#38bdf8" letter-spacing="1">PREDICTIVE INSIGHT ENGINE</text>
  <text x="700" y="128" text-anchor="middle" font-size="46" font-weight="800" fill="#f1f5f9" letter-spacing="2">SUPERVISED LEARNING PIPELINE</text>
  <text x="700" y="162" text-anchor="middle" font-size="16" fill="#64748b">House Price Prediction — from raw data to a business-ready model</text>
  <circle cx="700" cy="188" r="3.5" fill="#22d3ee"/><circle cx="714" cy="188" r="3.5" fill="#38bdf8"/><circle cx="728" cy="188" r="3.5" fill="#a3e635"/>

  <!-- sparkles -->
  <g fill="#38bdf8">
    <path d="M110 60 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 z">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M1280 55 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 z" fill="#a3e635">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ============ LEFT: 1. OBJECTIVE ============ -->
  <g>
    <rect class="card" x="40" y="215" width="330" height="150" rx="16"/>
    <circle cx="70" cy="245" r="22" fill="#082f3f" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="70" cy="245" r="10" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
    <circle cx="70" cy="245" r="3.5" fill="#22d3ee"/>
    <text class="num" x="104" y="240">1.</text>
    <text class="h" x="128" y="240">OBJECTIVE</text>
    <text class="t" x="62" y="288">End-to-end regression project:</text>
    <text class="t" x="62" y="310">raw housing data to a compared,</text>
    <text class="t" x="62" y="332">diagnosed &amp; business-ready model.</text>
  </g>

  <!-- ============ LEFT: 2. DATASET ============ -->
  <g>
    <rect class="card" x="40" y="385" width="330" height="170" rx="16"/>
    <circle cx="70" cy="415" r="22" fill="#082f3f" stroke="#22d3ee" stroke-width="2"/>
    <ellipse cx="70" cy="409" rx="9" ry="4" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <path d="M61 409 v12 c0 2.2 4 4 9 4 s9 -1.8 9 -4 v-12" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <text class="num" x="104" y="410">2.</text>
    <text class="h" x="128" y="410">DATASET</text>
    <g class="t">
      <circle cx="66" cy="452" r="3" fill="#38bdf8"/><text x="80" y="456">4,200 properties</text>
      <circle cx="66" cy="480" r="3" fill="#38bdf8"/><text x="80" y="484">10 input features</text>
      <circle cx="66" cy="508" r="3" fill="#38bdf8"/><text x="80" y="512">Train / test split</text>
      <circle cx="66" cy="536" r="3" fill="#38bdf8"/><text x="80" y="540">Cleaned &amp; normalized</text>
    </g>
  </g>

  <!-- ============ RIGHT: 3. TECHNIQUES ============ -->
  <g>
    <rect class="card" x="1030" y="215" width="330" height="180" rx="16"/>
    <circle cx="1060" cy="245" r="22" fill="#082f3f" stroke="#22d3ee" stroke-width="2"/>
    <path d="M1052 250 l5 5 l11 -12" stroke="#22d3ee" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text class="num" x="1094" y="240">3.</text>
    <text class="h" x="1118" y="240">TECHNIQUES</text>
    <g class="t">
      <circle cx="1056" cy="282" r="3" fill="#34d399"/><text x="1070" y="286">Simple linear regression</text>
      <circle cx="1056" cy="308" r="3" fill="#34d399"/><text x="1070" y="312">Multiple regression</text>
      <circle cx="1056" cy="334" r="3" fill="#34d399"/><text x="1070" y="338">Polynomial regression</text>
      <circle cx="1056" cy="360" r="3" fill="#34d399"/><text x="1070" y="364">Gradient descent optimization</text>
      <circle cx="1056" cy="386" r="3" fill="#34d399"/><text x="1070" y="390">Bias / variance diagnosis</text>
    </g>
  </g>

  <!-- ============ RIGHT: 4. RESULTS ============ -->
  <g>
    <rect class="card" x="1030" y="415" width="330" height="140" rx="16"/>
    <circle cx="1060" cy="445" r="22" fill="#082f3f" stroke="#22d3ee" stroke-width="2"/>
    <path d="M1052 452 v-10 M1060 452 v-14 M1068 452 v-18" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
    <text class="num" x="1094" y="440">4.</text>
    <text class="h" x="1118" y="440">RESULTS</text>
    <text class="t" x="1056" y="490">Model fit: <tspan fill="#34d399" font-weight="700">BALANCED</tspan></text>
    <text class="t" x="1056" y="514">RMSE: <tspan fill="#f1f5f9" font-weight="700">0.31</tspan></text>
    <text class="t" x="1056" y="538">R² score: <tspan fill="#38bdf8" font-weight="700">0.912</tspan></text>
  </g>

  <!-- ============ CENTER: animated monitor ============ -->
  <g>
    <rect x="420" y="215" width="560" height="340" rx="18" fill="#081524" stroke="#1e3a52" stroke-width="2"/>
    <rect x="420" y="215" width="560" height="46" rx="18" fill="#0b1f33"/>
    <circle cx="446" cy="238" r="5" fill="#f87171"/><circle cx="466" cy="238" r="5" fill="#fbbf24"/><circle cx="486" cy="238" r="5" fill="#34d399"/>
    <text x="700" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b" letter-spacing="2">REGRESSION MODEL</text>

    <!-- axes -->
    <line x1="480" y1="500" x2="920" y2="500" stroke="#1e3a52" stroke-width="2"/>
    <line x1="480" y1="500" x2="480" y2="290" stroke="#1e3a52" stroke-width="2"/>

    <!-- regression line drawing -->
    <line x1="490" y1="470" x2="910" y2="310" stroke="url(#cyan)" stroke-width="4" filter="url(#glow)"
      stroke-dasharray="500" stroke-dashoffset="500">
      <animate attributeName="stroke-dashoffset" values="500;0" dur="3s" repeatCount="indefinite"/>
    </line>

    <!-- data points -->
    <g fill="#38bdf8">
      <circle cx="530" cy="452" r="5"/><circle cx="580" cy="430" r="5" fill="#34d399"/>
      <circle cx="630" cy="445" r="5"/><circle cx="680" cy="400" r="5" fill="#34d399"/>
      <circle cx="730" cy="415" r="5"/><circle cx="780" cy="368" r="5" fill="#34d399"/>
      <circle cx="830" cy="382" r="5"/><circle cx="875" cy="340" r="5" fill="#a3e635"/>
    </g>

    <!-- travelling point on line -->
    <circle r="7" fill="#a5f3fc" filter="url(#glow)">
      <animateMotion dur="3s" repeatCount="indefinite" path="M490 470 L910 310"/>
    </circle>

    <!-- mini badges -->
    <rect x="500" y="278" width="120" height="30" rx="15" fill="#082f3f" stroke="#164e63"/>
    <text x="560" y="298" text-anchor="middle" class="chip">RMSE 0.31</text>
    <rect x="640" y="278" width="120" height="30" rx="15" fill="#082f3f" stroke="#164e63"/>
    <text x="700" y="298" text-anchor="middle" class="chip" fill="#a3e635">R² 0.912</text>
    <rect x="780" y="278" width="130" height="30" rx="15" fill="#082f3f" stroke="#164e63"/>
    <text x="845" y="298" text-anchor="middle" class="chip" fill="#34d399">BALANCED</text>

    <!-- monitor stand -->
    <rect x="672" y="555" width="56" height="26" fill="#0b1f33" stroke="#1e3a52"/>
    <rect x="630" y="581" width="140" height="12" rx="6" fill="#0b1f33" stroke="#1e3a52"/>
  </g>

  <!-- ============ BOTTOM: 5. WORKFLOW ============ -->
  <g>
    <rect class="card" x="40" y="625" width="1320" height="180" rx="18"/>
    <text class="num" x="80" y="666">5.</text>
    <text class="h" x="104" y="666">MODELING WORKFLOW</text>

    <g text-anchor="middle">
      <!-- step 1 -->
      <circle cx="150" cy="725" r="30" fill="#082f3f" stroke="#22d3ee" stroke-width="2"/>
      <text x="150" y="732" font-size="20" fill="#22d3ee">&#128270;</text>
      <text class="chip" x="150" y="778">EXPLORE</text>
      <path d="M195 725 h55" stroke="#164e63" stroke-width="3"/>
      <path d="M250 725 l-10 -6 v12 z" fill="#164e63"/>

      <!-- step 2 -->
      <circle cx="320" cy="725" r="30" fill="#082f3f" stroke="#22d3ee" stroke-width="2"/>
      <path d="M306 734 l8 -14 l7 8 l11 -16" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text class="chip" x="320" y="778">SPLIT</text>
      <path d="M365 725 h55" stroke="#164e63" stroke-width="3"/>
      <path d="M420 725 l-10 -6 v12 z" fill="#164e63"/>

      <!-- step 3 -->
      <circle cx="490" cy="725" r="30" fill="#082f3f" stroke="#22d3ee" stroke-width="2"/>
      <line x1="476" y1="736" x2="504" y2="712" stroke="#22d3ee" stroke-width="3"/>
      <circle cx="480" cy="720" r="3" fill="#38bdf8"/><circle cx="494" cy="730" r="3" fill="#38bdf8"/><circle cx="500" cy="716" r="3" fill="#34d399"/>
      <text class="chip" x="490" y="778">MODEL</text>
      <path d="M535 725 h55" stroke="#164e63" stroke-width="3"/>
      <path d="M590 725 l-10 -6 v12 z" fill="#164e63"/>

      <!-- step 4 -->
      <circle cx="660" cy="725" r="30" fill="#082f3f" stroke="#22d3ee" stroke-width="2"/>
      <path d="M648 725 l8 8 l16 -18" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text class="chip" x="660" y="778">EVALUATE</text>
      <path d="M705 725 h55" stroke="#164e63" stroke-width="3"/>
      <path d="M760 725 l-10 -6 v12 z" fill="#164e63"/>

      <!-- step 5 -->
      <circle cx="830" cy="725" r="30" fill="#082f3f" stroke="#22d3ee" stroke-width="2"/>
      <path d="M830 707 v10 M830 733 v10 M812 725 h10 M838 725 h10" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="830" cy="725" r="6" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <text class="chip" x="830" y="778">OPTIMIZE</text>
      <path d="M875 725 h55" stroke="#164e63" stroke-width="3"/>
      <path d="M930 725 l-10 -6 v12 z" fill="#164e63"/>

      <!-- step 6 -->
      <circle cx="1000" cy="725" r="30" fill="#082f3f" stroke="#22d3ee" stroke-width="2"/>
      <path d="M990 712 a16 16 0 1 0 20 20" stroke="#a3e635" stroke-width="2.5" fill="none"/>
      <path d="M988 736 h8" stroke="#a3e635" stroke-width="2.5"/>
      <text class="chip" x="1000" y="778">DIAGNOSE</text>
      <path d="M1045 725 h55" stroke="#164e63" stroke-width="3"/>
      <path d="M1100 725 l-10 -6 v12 z" fill="#164e63"/>

      <!-- step 7 -->
      <circle cx="1170" cy="725" r="30" fill="#082f3f" stroke="#34d399" stroke-width="2"/>
      <rect x="1158" y="712" width="24" height="26" rx="3" fill="none" stroke="#34d399" stroke-width="2"/>
      <path d="M1163 720 h14 M1163 726 h14 M1163 732 h9" stroke="#34d399" stroke-width="2"/>
      <text class="chip" x="1170" y="778">REPORT</text>
    </g>

    <!-- progress pulse along workflow -->
    <circle r="6" fill="#a5f3fc" filter="url(#glow)">
      <animateMotion dur="6s" repeatCount="indefinite" path="M150 725 H1200"/>
    </circle>
  </g>

  <!-- ============ FOOTER: OUTCOME + TECH ============ -->
  <g>
    <rect class="card" x="40" y="830" width="650" height="95" rx="16"/>
    <circle cx="80" cy="877" r="24" fill="#082f3f" stroke="#a3e635" stroke-width="2"/>
    <path d="M72 868 h16 v6 a8 8 0 0 1 -16 0 z M74 885 h12" stroke="#a3e635" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text class="h" x="118" y="866" fill="#a3e635">OUTCOME</text>
    <text class="t" x="118" y="892">High-accuracy, bias-checked model — ready for business decisions.</text>
  </g>
  <g>
    <rect class="card" x="710" y="830" width="650" height="95" rx="16"/>
    <circle cx="750" cy="877" r="24" fill="#082f3f" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="750" cy="877" r="8" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
    <path d="M750 865 v-6 M750 895 v-6 M738 877 h-6 M768 877 h-6" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
    <text class="h" x="788" y="866">STACK</text>
    <text class="t" x="788" y="892">Python · Pandas · NumPy · Scikit-learn · Matplotlib</text>
  </g>
</svg>
