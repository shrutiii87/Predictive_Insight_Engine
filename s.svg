<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#0d2137"/>
      <stop offset="60%" stop-color="#081527"/>
      <stop offset="100%" stop-color="#050c16"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#12293d" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="560" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="20" fill="url(#grid)"/>

  <!-- title -->
  <rect x="60" y="46" width="52" height="6" rx="3" fill="#22d3ee" filter="url(#glow)"/>
  <text x="60" y="112" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#f1f5f9">Predictive Insight Engine</text>
  <text x="60" y="152" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#38bdf8">Supervised Learning &amp; Regression Pipeline</text>

  <!-- pipeline bar -->
  <rect x="60" y="200" width="660" height="170" rx="18" fill="#0b1f33" stroke="#1e3a52"/>
  <text x="88" y="238" font-family="Arial, sans-serif" font-size="14" letter-spacing="4" fill="#64748b">PIPELINE STATUS</text>

  <line x1="120" y1="290" x2="660" y2="290" stroke="#164e63" stroke-width="4"/>
  <line x1="120" y1="290" x2="660" y2="290" stroke="url(#cyan)" stroke-width="4" stroke-dasharray="540" stroke-dashoffset="540">
    <animate attributeName="stroke-dashoffset" values="540;0;0" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- moving pulse dot -->
  <circle r="7" fill="#a5f3fc" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M120 290 H660"/>
  </circle>

  <!-- step nodes -->
  <g font-family="Arial, sans-serif" font-size="15" text-anchor="middle">
    <circle cx="120" cy="290" r="22" fill="#0b1f33" stroke="#22d3ee" stroke-width="2.5"/>
    <text x="120" y="296" fill="#22d3ee" font-size="12" font-weight="700">EDA</text>
    <text x="120" y="336" fill="#94a3b8">EXPLORE</text>

    <circle cx="300" cy="290" r="22" fill="#0b1f33" stroke="#22d3ee" stroke-width="2.5"/>
    <path d="M290 290 l7 7 l14 -14" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="300" y="336" fill="#94a3b8">REGRESS</text>

    <circle cx="480" cy="290" r="22" fill="#0b1f33" stroke="#22d3ee" stroke-width="2.5"/>
    <path d="M470 292 l6 -8 l5 6 l8 -12" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="480" y="336" fill="#94a3b8">OPTIMIZE</text>

    <circle cx="660" cy="290" r="22" fill="#0b1f33" stroke="#34d399" stroke-width="2.5"/>
    <path d="M650 290 l7 7 l14 -14" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="660" y="336" fill="#94a3b8">REPORT</text>
  </g>

  <!-- model monitor card -->
  <rect x="760" y="46" width="390" height="324" rx="20" fill="#0b1f33" stroke="#1e3a52"/>
  <text x="790" y="86" font-family="Arial, sans-serif" font-size="13" letter-spacing="3" fill="#64748b">MODEL MONITOR</text>
  <text x="790" y="112" font-family="Arial, sans-serif" font-size="18" fill="#e2e8f0">Price signal verification</text>

  <!-- radar -->
  <g transform="translate(890,235)">
    <circle r="95" fill="#081524" stroke="#1e3a52"/>
    <circle r="62" fill="none" stroke="#164e63"/>
    <circle r="30" fill="none" stroke="#164e63"/>
    <line x1="-95" y1="0" x2="95" y2="0" stroke="#123043"/>
    <line x1="0" y1="-95" x2="0" y2="95" stroke="#123043"/>
    <!-- sweep -->
    <path d="M0 0 L0 -95 A95 95 0 0 1 67 -67 Z" fill="#22d3ee" opacity="0.25">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <line x1="0" y1="0" x2="0" y2="-95" stroke="#22d3ee" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <!-- blips -->
    <circle cx="-52" cy="34" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="-46" r="5" fill="#a3e635">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="58" cy="48" r="7" fill="#a3e635">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- center pulse -->
    <circle r="10" fill="#22d3ee" filter="url(#glow)">
      <animate attributeName="r" values="8;14;8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- fit card -->
  <rect x="1010" y="150" width="112" height="150" rx="12" fill="#081524" stroke="#1e3a52"/>
  <text x="1022" y="176" font-family="Arial, sans-serif" font-size="11" fill="#64748b">FIT</text>
  <text x="1022" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#34d399">BALANCED</text>
  <text x="1022" y="232" font-family="Arial, sans-serif" font-size="11" fill="#64748b">RMSE</text>
  <text x="1022" y="254" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">0.31</text>
  <text x="1022" y="278" font-family="Arial, sans-serif" font-size="11" fill="#64748b">R² SCORE</text>
  <text x="1022" y="298" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#38bdf8">0.912</text>

  <!-- bottom legend -->
  <g font-family="Arial, sans-serif" font-size="14" letter-spacing="2" fill="#94a3b8">
    <circle cx="70" cy="530" r="6" fill="#34d399"/><text x="86" y="535">4,200 PROPERTIES</text>
    <circle cx="280" cy="530" r="6" fill="#38bdf8"/><text x="296" y="535">10 FEATURES</text>
    <circle cx="460" cy="530" r="6" fill="#a3e635"/><text x="476" y="535">GRADIENT DESCENT</text>
  </g>
</svg>
