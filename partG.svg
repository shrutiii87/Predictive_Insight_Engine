<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- BACKGROUND -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#020B1C"/>
      <stop offset="0.5" stop-color="#041428"/>
      <stop offset="1" stop-color="#06243D"/>
    </linearGradient>

    <!-- CARD -->
    <linearGradient id="card" x1="730" y1="60" x2="1130" y2="360"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#06243D"/>
      <stop offset="1" stop-color="#073B5C"/>
    </linearGradient>

    <!-- CYAN -->
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5DEAFF"/>
      <stop offset="1" stop-color="#168FC4"/>
    </linearGradient>

    <!-- OPTIMIZATION -->
    <linearGradient id="optimize" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#168FC4"/>
      <stop offset="0.45" stop-color="#5DEAFF"/>
      <stop offset="0.75" stop-color="#3BE38A"/>
      <stop offset="1" stop-color="#5DEAFF"/>
    </linearGradient>

    <!-- GLOW -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- GRID -->
    <pattern id="grid" width="36" height="36"
             patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36"
            stroke="#5DEAFF"
            stroke-opacity="0.055"/>
    </pattern>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>

  <rect width="1200" height="420" rx="24" fill="url(#grid)">
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="36 36"
      dur="8s"
      repeatCount="indefinite"/>
  </rect>

  <ellipse cx="965" cy="210"
           rx="260"
           ry="175"
           fill="#168FC4"
           opacity="0.06"
           filter="url(#softGlow)">
    <animate
      attributeName="opacity"
      values="0.04;0.10;0.04"
      dur="4s"
      repeatCount="indefinite"/>
  </ellipse>


  <!-- ================================================= -->
  <!-- LEFT CONTENT -->
  <!-- ================================================= -->

  <text x="70" y="82"
        fill="#5DEAFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        letter-spacing="3">
    PART G
  </text>

  <text x="70" y="125"
        fill="white"
        font-family="Arial, Helvetica, sans-serif"
        font-size="34"
        font-weight="700">
    Gradient Descent Optimization
  </text>

  <text x="70" y="155"
        fill="#8FB7C9"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16">
    Finding the Minimum Loss
  </text>

  <text x="70" y="190"
        fill="#A9C4D2"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    Iteratively adjusting model parameters
  </text>

  <text x="70" y="212"
        fill="#A9C4D2"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    to minimize the cost function
  </text>


  <!-- ================================================= -->
  <!-- OPTIMIZATION PIPELINE -->
  <!-- ================================================= -->

  <rect x="65" y="245"
        width="500"
        height="95"
        rx="14"
        fill="#061B30"
        stroke="#168FC4"
        stroke-opacity="0.35"/>

  <text x="85" y="270"
        fill="#5DEAFF"
        font-family="Arial"
        font-size="10"
        font-weight="700"
        letter-spacing="2">
    OPTIMIZATION LOOP
  </text>


  <!-- MAIN PIPELINE -->

  <path d="M110 304 H520"
        stroke="#168FC4"
        stroke-opacity="0.25"
        stroke-width="2"/>

  <path d="M110 304 H520"
        stroke="url(#optimize)"
        stroke-width="2"
        stroke-dasharray="45 370"
        stroke-linecap="round">

    <animate
      attributeName="stroke-dashoffset"
      from="0"
      to="-415"
      dur="2.8s"
      repeatCount="indefinite"/>
  </path>


  <!-- NODES -->

  <circle cx="110" cy="304"
          r="7"
          fill="#06243D"
          stroke="#5DEAFF"
          stroke-width="2">

    <animate
      attributeName="r"
      values="7;10;7"
      dur="2s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="245" cy="304"
          r="7"
          fill="#06243D"
          stroke="#5DEAFF"
          stroke-width="2">

    <animate
      attributeName="r"
      values="7;10;7"
      dur="2s"
      begin="0.4s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="380" cy="304"
          r="7"
          fill="#06243D"
          stroke="#5DEAFF"
          stroke-width="2">

    <animate
      attributeName="r"
      values="7;10;7"
      dur="2s"
      begin="0.8s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="515" cy="304"
          r="7"
          fill="#06243D"
          stroke="#3BE38A"
          stroke-width="2">

    <animate
      attributeName="r"
      values="7;11;7"
      dur="2s"
      begin="1.2s"
      repeatCount="indefinite"/>
  </circle>


  <!-- LABELS -->

  <text x="87" y="326"
        fill="#9BBAC8"
        font-family="Arial"
        font-size="10">
    START
  </text>

  <text x="220" y="326"
        fill="#9BBAC8"
        font-family="Arial"
        font-size="10">
    GRADIENT
  </text>

  <text x="354" y="326"
        fill="#9BBAC8"
        font-family="Arial"
        font-size="10">
    UPDATE
  </text>

  <text x="486" y="326"
        fill="#3BE38A"
        font-family="Arial"
        font-size="10"
        font-weight="700">
    CONVERGE
  </text>


  <!-- ================================================= -->
  <!-- LEGEND -->
  <!-- ================================================= -->

  <circle cx="82" cy="375" r="5" fill="#5DEAFF"/>

  <text x="95" y="379"
        fill="#8FAFBE"
        font-family="Arial"
        font-size="10">
    PARAMETER UPDATE
  </text>

  <circle cx="225" cy="375" r="5" fill="#168FC4"/>

  <text x="238" y="379"
        fill="#8FAFBE"
        font-family="Arial"
        font-size="10">
    LOSS
  </text>

  <circle cx="300" cy="375" r="5" fill="#3BE38A"/>

  <text x="313" y="379"
        fill="#8FAFBE"
        font-family="Arial"
        font-size="10">
    MINIMUM
  </text>


  <!-- ================================================= -->
  <!-- RIGHT CARD -->
  <!-- ================================================= -->

  <rect x="625"
        y="45"
        width="510"
        height="330"
        rx="20"
        fill="url(#card)"
        stroke="#168FC4"
        stroke-opacity="0.55"/>

  <rect x="625"
        y="45"
        width="510"
        height="330"
        rx="20"
        stroke="#5DEAFF"
        stroke-opacity="0.15"
        stroke-width="2">

    <animate
      attributeName="stroke-opacity"
      values="0.08;0.28;0.08"
      dur="3s"
      repeatCount="indefinite"/>
  </rect>


  <!-- ================================================= -->
  <!-- HEADER -->
  <!-- ================================================= -->

  <text x="655"
        y="78"
        fill="#5DEAFF"
        font-family="Arial"
        font-size="11"
        font-weight="700"
        letter-spacing="2">
    GRADIENT DESCENT
  </text>

  <text x="655"
        y="101"
        fill="white"
        font-family="Arial"
        font-size="15"
        font-weight="600">
    Loss Optimization Monitor
  </text>


  <!-- ================================================= -->
  <!-- EQUATION -->
  <!-- ================================================= -->

  <rect x="655"
        y="115"
        width="300"
        height="38"
        rx="9"
        fill="#04182A"
        stroke="#168FC4"
        stroke-opacity="0.35"/>

  <text x="672"
        y="139"
        fill="#5DEAFF"
        font-family="Arial"
        font-size="13"
        font-weight="700">
    θ = θ − α · ∇J(θ)
  </text>


  <!-- LEARNING RATE -->

  <rect x="975"
        y="115"
        width="125"
        height="38"
        rx="9"
        fill="#04182A"
        stroke="#3BE38A"
        stroke-opacity="0.35"/>

  <text x="988"
        y="130"
        fill="#8FAFBE"
        font-family="Arial"
        font-size="8"
        font-weight="700">
    LEARNING RATE
  </text>

  <text x="1035"
        y="144"
        fill="#3BE38A"
        font-family="Arial"
        font-size="11"
        font-weight="700">
    α = 0.01
  </text>


  <!-- ================================================= -->
  <!-- LOSS CURVE GRAPH -->
  <!-- ================================================= -->

  <rect x="655"
        y="170"
        width="445"
        height="160"
        rx="10"
        fill="#04182A"
        stroke="#168FC4"
        stroke-opacity="0.25"/>


  <!-- GRAPH GRID -->

  <path d="M685 200 H1070
           M685 230 H1070
           M685 260 H1070
           M685 290 H1070
           M685 320 H1070"
        stroke="#5DEAFF"
        stroke-opacity="0.07"/>

  <path d="M725 185 V320
           M775 185 V320
           M825 185 V320
           M875 185 V320
           M925 185 V320
           M975 185 V320
           M1025 185 V320"
        stroke="#5DEAFF"
        stroke-opacity="0.07"/>


  <!-- AXES -->

  <path d="M685 320 H1070"
        stroke="#8FB7C9"
        stroke-opacity="0.4"/>

  <path d="M685 320 V185"
        stroke="#8FB7C9"
        stroke-opacity="0.4"/>


  <!-- ================================================= -->
  <!-- LOSS CURVE -->
  <!-- ================================================= -->

  <path d="M695 205
           C730 208 755 225 785 255
           C815 286 845 313 885 318
           C925 323 955 306 980 275
           C1015 232 1040 205 1065 190"
        fill="none"
        stroke="#168FC4"
        stroke-opacity="0.13"
        stroke-width="9"
        filter="url(#softGlow)"/>

  <path d="M695 205
           C730 208 755 225 785 255
           C815 286 845 313 885 318
           C925 323 955 306 980 275
           C1015 232 1040 205 1065 190"
        fill="none"
        stroke="url(#optimize)"
        stroke-width="3"
        stroke-linecap="round"/>


  <!-- ================================================= -->
  <!-- DESCENT STEPS -->
  <!-- ================================================= -->

  <!-- Step 1 -->

  <path d="M720 212 L770 245"
        stroke="#5DEAFF"
        stroke-width="2"
        stroke-dasharray="5 4"
        opacity="0.7"/>

  <!-- Step 2 -->

  <path d="M770 245 L815 285"
        stroke="#5DEAFF"
        stroke-width="2"
        stroke-dasharray="5 4"
        opacity="0.7"/>

  <!-- Step 3 -->

  <path d="M815 285 L855 312"
        stroke="#5DEAFF"
        stroke-width="2"
        stroke-dasharray="5 4"
        opacity="0.7"/>

  <!-- Step 4 -->

  <path d="M855 312 L885 318"
        stroke="#3BE38A"
        stroke-width="2"
        stroke-dasharray="5 4"
        opacity="0.8"/>


  <!-- ================================================= -->
  <!-- ANIMATED DESCENT POINT -->
  <!-- ================================================= -->

  <circle cx="720"
          cy="212"
          r="7"
          fill="#06243D"
          stroke="#5DEAFF"
          stroke-width="2"
          filter="url(#glow)">

    <animateMotion
      path="M0 0
            C50 33 95 73 135 100
            C175 127 215 105 260 63
            C300 25 325 5 345 -22"
      dur="5s"
      repeatCount="indefinite"/>
  </circle>


  <!-- Moving glow -->

  <circle cx="720"
          cy="212"
          r="14"
          fill="none"
          stroke="#5DEAFF"
          stroke-opacity="0.35">

    <animateMotion
      path="M0 0
            C50 33 95 73 135 100
            C175 127 215 105 260 63
            C300 25 325 5 345 -22"
      dur="5s"
      repeatCount="indefinite"/>

    <animate
      attributeName="r"
      values="8;18;8"
      dur="1.5s"
      repeatCount="indefinite"/>
  </circle>


  <!-- ================================================= -->
  <!-- MINIMUM POINT -->
  <!-- ================================================= -->

  <circle cx="885"
          cy="318"
          r="12"
          fill="none"
          stroke="#3BE38A"
          stroke-width="2"
          opacity="0.8">

    <animate
      attributeName="r"
      values="8;20;8"
      dur="2s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0.8;0;0.8"
      dur="2s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="885"
          cy="318"
          r="5"
          fill="#3BE38A"
          filter="url(#glow)"/>

  <text x="898"
        y="315"
        fill="#3BE38A"
        font-family="Arial"
        font-size="9"
        font-weight="700">
    MINIMUM
  </text>


  <!-- ================================================= -->
  <!-- ITERATION COUNTER -->
  <!-- ================================================= -->

  <rect x="930"
        y="285"
        width="140"
        height="30"
        rx="8"
        fill="#061B30"
        stroke="#168FC4"
        stroke-opacity="0.3"/>

  <text x="945"
        y="304"
        fill="#8FAFBE"
        font-family="Arial"
        font-size="9">
    ITERATION
  </text>

  <text x="1010"
        y="304"
        fill="#5DEAFF"
        font-family="Arial"
        font-size="11"
        font-weight="700">
    247
  </text>


  <!-- ================================================= -->
  <!-- LOSS STATUS -->
  <!-- ================================================= -->

  <rect x="655"
        y="342"
        width="445"
        height="20"
        rx="6"
        fill="#04182A"/>

  <circle cx="670"
          cy="352"
          r="4"
          fill="#3BE38A"
          filter="url(#glow)">

    <animate
      attributeName="r"
      values="3;6;3"
      dur="1.5s"
      repeatCount="indefinite"/>
  </circle>

  <text x="682"
        y="356"
        fill="#3BE38A"
        font-family="Arial"
        font-size="9"
        font-weight="700">
    LOSS DECREASING
  </text>

  <text x="1005"
        y="356"
        fill="#8FB7C9"
        font-family="Arial"
        font-size="9">
    CONVERGING
  </text>


  <!-- ================================================= -->
  <!-- MOVING SCAN LINE -->
  <!-- ================================================= -->

  <rect x="650"
        y="55"
        width="2"
        height="305"
        fill="#5DEAFF"
        opacity="0.10">

    <animate
      attributeName="x"
      values="650;1125;650"
      dur="6s"
      repeatCount="indefinite"/>
  </rect>


  <!-- ================================================= -->
  <!-- FRAME -->
  <!-- ================================================= -->

  <rect x="1"
        y="1"
        width="1198"
        height="418"
        rx="23"
        stroke="#168FC4"
        stroke-opacity="0.35"/>

</svg>
