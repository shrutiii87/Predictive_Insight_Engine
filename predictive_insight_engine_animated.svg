<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#07111f"/>
    <stop offset=".5" stop-color="#0b1d33"/>
    <stop offset="1" stop-color="#111827"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" x2="1">
    <stop stop-color="#22d3ee"/>
    <stop offset=".5" stop-color="#38bdf8"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="chart" x1="0" x2="1">
    <stop stop-color="#38bdf8"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".45"/>
  </filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#1e3a5f" stroke-width="1"/>
  </pattern>
</defs>

<!-- BACKGROUND -->
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect width="1200" height="420" rx="28" fill="url(#grid)" opacity=".45"/>
<circle cx="1080" cy="55" r="135" fill="#38bdf8" opacity=".06" filter="url(#glow)">
  <animate attributeName="r" values="105;140;105" dur="5s" repeatCount="indefinite"/>
</circle>
<circle cx="720" cy="360" r="110" fill="#a78bfa" opacity=".045" filter="url(#glow)"/>

<!-- LEFT TITLE -->
<text x="62" y="82" font-family="Arial,sans-serif" font-size="38" font-weight="800" fill="#f8fafc">Predictive</text>
<text x="62" y="126" font-family="Arial,sans-serif" font-size="38" font-weight="800" fill="#f8fafc">Insight Engine</text>
<rect x="64" y="143" width="92" height="3" rx="2" fill="url(#accent)" filter="url(#glow)"/>
<text x="64" y="174" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8">Housing price prediction • Regression analytics</text>
<text x="64" y="196" font-family="monospace" font-size="10" fill="#64748b">RAW DATA → MODEL → EVALUATION → INSIGHT</text>

<!-- DATA / MODEL CARD -->
<g transform="translate(60 225)" filter="url(#shadow)">
  <rect width="430" height="135" rx="20" fill="#0a1728" stroke="#244563"/>
  <circle cx="24" cy="22" r="5" fill="#22d3ee"/>
  <circle cx="42" cy="22" r="5" fill="#38bdf8"/>
  <circle cx="60" cy="22" r="5" fill="#a78bfa"/>
  <text x="85" y="27" font-family="monospace" font-size="11" fill="#64748b">housing_prediction_model</text>

  <!-- chart -->
  <line x1="28" y1="108" x2="395" y2="108" stroke="#243b53"/>
  <line x1="28" y1="38" x2="28" y2="108" stroke="#243b53"/>
  <polyline points="35,94 75,86 112,91 150,72 187,78 225,59 265,65 302,45 342,51 390,31"
            fill="none" stroke="url(#chart)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="520" stroke-dashoffset="520" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset"
             values="520;0;520"
             dur="4s"
             repeatCount="indefinite"/>
  </polyline>
  <polyline points="35,98 75,89 112,84 150,79 187,70 225,66 265,59 302,55 342,43 390,38"
            fill="none" stroke="#e2e8f0" stroke-opacity=".35" stroke-width="2" stroke-dasharray="5 5"/>
  <g fill="#38bdf8">
    <circle cx="75" cy="86" r="3"/><circle cx="150" cy="72" r="3"/><circle cx="225" cy="59" r="3"/><circle cx="302" cy="45" r="3"/><circle cx="390" cy="31" r="3"/>
  </g>
  <text x="35" y="124" font-family="monospace" font-size="9" fill="#64748b">ACTUAL</text>
  <text x="125" y="124" font-family="monospace" font-size="9" fill="#64748b">PREDICTED</text>
  <text x="270" y="124" font-family="monospace" font-size="9" fill="#64748b">REGRESSION</text>
</g>

<!-- RIGHT PIPELINE -->
<g transform="translate(570 50)">
  <path d="M55 45V335" stroke="#28445f" stroke-width="2"/>
  <circle r="6" fill="#38bdf8" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M55 45V335"/>
  </circle>

  <!-- NODE 1 -->
  <g transform="translate(0 25)">
    <circle cx="55" cy="20" r="20" fill="#0e2238" stroke="#22d3ee" stroke-width="3"/>
    <text x="55" y="25" text-anchor="middle" font-family="monospace" font-size="11" fill="#67e8f9">01</text>
    <rect x="95" y="-7" width="205" height="54" rx="14" fill="#0a1728" stroke="#244563"/>
    <text x="115" y="16" font-family="Arial" font-size="13" font-weight="700" fill="#f8fafc">HOUSING DATA</text>
    <text x="115" y="34" font-family="monospace" font-size="10" fill="#64748b">area • bedrooms • location</text>
  </g>

  <!-- NODE 2 -->
  <g transform="translate(0 105)">
    <circle cx="55" cy="20" r="20" fill="#111d38" stroke="#38bdf8" stroke-width="3"/>
    <path d="M47 20L53 26L65 12" fill="none" stroke="#bae6fd" stroke-width="3"/>
    <rect x="95" y="-7" width="205" height="54" rx="14" fill="#0a1728" stroke="#244563"/>
    <text x="115" y="16" font-family="Arial" font-size="13" font-weight="700" fill="#f8fafc">REGRESSION MODELS</text>
    <text x="115" y="34" font-family="monospace" font-size="10" fill="#64748b">linear • multiple • polynomial</text>
  </g>

  <!-- NODE 3 -->
  <g transform="translate(0 185)">
    <circle cx="55" cy="20" r="20" fill="#151b3d" stroke="#a78bfa" stroke-width="3"/>
    <polyline points="44,28 51,18 58,23 67,10" fill="none" stroke="#ddd6fe" stroke-width="3"/>
    <rect x="95" y="-7" width="205" height="54" rx="14" fill="#0a1728" stroke="#244563"/>
    <text x="115" y="16" font-family="Arial" font-size="13" font-weight="700" fill="#f8fafc">MODEL EVALUATION</text>
    <text x="115" y="34" font-family="monospace" font-size="10" fill="#64748b">MSE • MAE • RMSE • R²</text>
  </g>

  <!-- NODE 4 -->
  <g transform="translate(0 265)">
    <circle cx="55" cy="20" r="20" fill="#0e2238" stroke="#22d3ee" stroke-width="3"/>
    <text x="55" y="25" text-anchor="middle" font-family="monospace" font-size="10" fill="#67e8f9">AI</text>
    <rect x="95" y="-7" width="205" height="54" rx="14" fill="#0a1728" stroke="#244563"/>
    <text x="115" y="16" font-family="Arial" font-size="13" font-weight="700" fill="#f8fafc">PREDICTIVE INSIGHT</text>
    <text x="115" y="34" font-family="monospace" font-size="10" fill="#64748b">price prediction • business-ready</text>
  </g>
</g>

<!-- FLOATING METRICS -->
<g filter="url(#shadow)">
  <g transform="translate(930 40)">
    <rect width="145" height="62" rx="16" fill="#0a1728" stroke="#244563"/>
    <text x="18" y="22" font-family="monospace" font-size="9" fill="#64748b">MODEL FIT</text>
    <text x="18" y="48" font-family="Arial" font-size="23" font-weight="800" fill="#38bdf8">R² 0.94</text>
    <animateTransform attributeName="transform" type="translate" values="930 40;930 30;930 40" dur="3s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(930 130)">
    <rect width="145" height="62" rx="16" fill="#0a1728" stroke="#244563"/>
    <text x="18" y="22" font-family="monospace" font-size="9" fill="#64748b">PREDICTION</text>
    <text x="18" y="48" font-family="Arial" font-size="23" font-weight="800" fill="#a78bfa">READY</text>
    <animateTransform attributeName="transform" type="translate" values="930 130;930 138;930 130" dur="3.4s" repeatCount="indefinite"/>
  </g>
</g>

<!-- FEATURE PILLS -->
<g font-family="monospace" font-size="10">
  <g transform="translate(930 225)"><rect width="86" height="28" rx="14" fill="#0e2238" stroke="#22d3ee"/><text x="43" y="18" text-anchor="middle" fill="#67e8f9">AREA</text></g>
  <g transform="translate(1025 225)"><rect width="65" height="28" rx="14" fill="#111d38" stroke="#38bdf8"/><text x="32" y="18" text-anchor="middle" fill="#bae6fd">AGE</text></g>
  <g transform="translate(930 265)"><rect width="86" height="28" rx="14" fill="#151b3d" stroke="#a78bfa"/><text x="43" y="18" text-anchor="middle" fill="#ddd6fe">LOCATION</text></g>
  <g transform="translate(1025 265)"><rect width="65" height="28" rx="14" fill="#0e2238" stroke="#22d3ee"/><text x="32" y="18" text-anchor="middle" fill="#67e8f9">PRICE</text></g>
</g>

<!-- DATA PARTICLES -->
<g fill="#38bdf8" filter="url(#glow)">
  <circle cx="510" cy="70" r="3"><animate attributeName="cy" values="70;50;70" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="800" cy="330" r="3"><animate attributeName="cy" values="330;310;330" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="1120" cy="340" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="1.7s" repeatCount="indefinite"/></circle>
</g>
</svg>
