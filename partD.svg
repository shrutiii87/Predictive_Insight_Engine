<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020B1C"/>
      <stop offset="0.5" stop-color="#041428"/>
      <stop offset="1" stop-color="#06243D"/>
    </linearGradient>

    <!-- Card -->
    <linearGradient id="card" x1="760" y1="70" x2="1130" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06243D"/>
      <stop offset="1" stop-color="#073B5C"/>
    </linearGradient>

    <!-- Cyan -->
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5DEAFF"/>
      <stop offset="1" stop-color="#168FC4"/>
    </linearGradient>

    <!-- Metric gradient -->
    <linearGradient id="metric" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#168FC4"/>
      <stop offset="0.5" stop-color="#5DEAFF"/>
      <stop offset="1" stop-color="#3BE38A"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <!-- Moving Grid -->
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#5DEAFF" stroke-opacity="0.055"/>
    </pattern>

  </defs>


  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>

  <rect width="1200" height="420" rx="24" fill="url(#grid)">
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="36 36"
      dur="8s"
      repeatCount="indefinite"/>
  </rect>

  <!-- Ambient glow -->
  <ellipse cx="1000" cy="210" rx="250" ry="170"
           fill="#168FC4" opacity="0.07"
           filter="url(#softGlow)">
    <animate
      attributeName="opacity"
      values="0.04;0.10;0.04"
      dur="4s"
      repeatCount="indefinite"/>
  </ellipse>


  <!-- ===================================================== -->
  <!-- LEFT SECTION -->
  <!-- ===================================================== -->

  <text x="70" y="82"
        fill="#5DEAFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        letter-spacing="3">
    PART D
  </text>

  <text x="70" y="125"
        fill="white"
        font-family="Arial, Helvetica, sans-serif"
        font-size="34"
        font-weight="700">
    Model Evaluation Metrics
  </text>

  <text x="70" y="155"
        fill="#8FB7C9"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16">
    Measuring Model Performance
  </text>

  <text x="70" y="190"
        fill="#A9C4D2"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    Evaluating prediction accuracy using
  </text>

  <text x="70" y="212"
        fill="#A9C4D2"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    reliable regression performance metrics
  </text>


  <!-- ===================================================== -->
  <!-- EVALUATION PIPELINE -->
  <!-- ===================================================== -->

  <rect x="65" y="245" width="500" height="95" rx="14"
        fill="#061B30"
        stroke="#168FC4"
        stroke-opacity="0.35"/>

  <text x="85" y="270"
        fill="#5DEAFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10"
        font-weight="700"
        letter-spacing="2">
    EVALUATION PIPELINE
  </text>

  <!-- Pipeline line -->
  <path d="M105 304 H520"
        stroke="#168FC4"
        stroke-opacity="0.25"
        stroke-width="2"/>

  <path d="M105 304 H520"
        stroke="url(#metric)"
        stroke-width="2"
        stroke-dasharray="45 370"
        stroke-linecap="round">

    <animate
      attributeName="stroke-dashoffset"
      from="0"
      to="-415"
      dur="2.8s"
      repeatCount="indefinite"/>
  </path>


  <!-- Nodes -->

  <circle cx="110" cy="304" r="7" fill="#06243D" stroke="#5DEAFF" stroke-width="2">
    <animate attributeName="r"
             values="7;10;7"
             dur="2s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="245" cy="304" r="7" fill="#06243D" stroke="#5DEAFF" stroke-width="2">
    <animate attributeName="r"
             values="7;10;7"
             dur="2s"
             begin="0.4s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="380" cy="304" r="7" fill="#06243D" stroke="#5DEAFF" stroke-width="2">
    <animate attributeName="r"
             values="7;10;7"
             dur="2s"
             begin="0.8s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="515" cy="304" r="7" fill="#06243D" stroke="#3BE38A" stroke-width="2">
    <animate attributeName="r"
             values="7;10;7"
             dur="2s"
             begin="1.2s"
             repeatCount="indefinite"/>
  </circle>


  <text x="88" y="326"
        fill="#9BBAC8"
        font-family="Arial"
        font-size="10">
    ACTUAL
  </text>

  <text x="222" y="326"
        fill="#9BBAC8"
        font-family="Arial"
        font-size="10">
    PREDICTED
  </text>

  <text x="363" y="326"
        fill="#9BBAC8"
        font-family="Arial"
        font-size="10">
    COMPARE
  </text>

  <text x="495" y="326"
        fill="#3BE38A"
        font-family="Arial"
        font-size="10"
        font-weight="700">
    SCORE
  </text>


  <!-- ===================================================== -->
  <!-- LEGEND -->
  <!-- ===================================================== -->

  <circle cx="82" cy="375" r="5" fill="#5DEAFF"/>

  <text x="95" y="379"
        fill="#8FAFBE"
        font-family="Arial"
        font-size="10">
    ACCURACY
  </text>

  <circle cx="175" cy="375" r="5" fill="#3BE38A"/>

  <text x="188" y="379"
        fill="#8FAFBE"
        font-family="Arial"
        font-size="10">
    LOW ERROR
  </text>

  <circle cx="280" cy="375" r="5" fill="#168FC4"/>

  <text x="293" y="379"
        fill="#8FAFBE"
        font-family="Arial"
        font-size="10">
    MODEL SCORE
  </text>


  <!-- ===================================================== -->
  <!-- RIGHT METRICS CARD -->
  <!-- ===================================================== -->

  <rect x="625" y="45" width="510" height="330" rx="20"
        fill="url(#card)"
        stroke="#168FC4"
        stroke-opacity="0.55"/>

  <!-- Card glow -->
  <rect x="625" y="45" width="510" height="330" rx="20"
        stroke="#5DEAFF"
        stroke-opacity="0.15"
        stroke-width="2">

    <animate
      attributeName="stroke-opacity"
      values="0.08;0.28;0.08"
      dur="3s"
      repeatCount="indefinite"/>
  </rect>


  <!-- Header -->

  <text x="655" y="78"
        fill="#5DEAFF"
        font-family="Arial"
        font-size="11"
        font-weight="700"
        letter-spacing="2">
    MODEL EVALUATION
  </text>

  <text x="655" y="101"
        fill="white"
        font-family="Arial"
        font-size="15"
        font-weight="600">
    Regression Performance Monitor
  </text>


  <!-- ===================================================== -->
  <!-- METRIC BARS -->
  <!-- ===================================================== -->

  <!-- R2 -->
  <text x="655" y="138"
        fill="#A8C6D4"
        font-family="Arial"
        font-size="11"
        font-weight="700">
    R² SCORE
  </text>

  <text x="1070" y="138"
        fill="#5DEAFF"
        font-family="Arial"
        font-size="13"
        font-weight="700">
    0.912
  </text>

  <rect x="655" y="146" width="420" height="7" rx="3.5"
        fill="#0A2B43"/>

  <rect x="655" y="146" width="0" height="7" rx="3.5"
        fill="url(#metric)">
    <animate
      attributeName="width"
      values="0;383;383"
      dur="2s"
      repeatCount="indefinite"/>
  </rect>


  <!-- MAE -->
  <text x="655" y="180"
        fill="#A8C6D4"
        font-family="Arial"
        font-size="11"
        font-weight="700">
    MAE
  </text>

  <text x="1070" y="180"
        fill="#3BE38A"
        font-family="Arial"
        font-size="13"
        font-weight="700">
    2.41
  </text>

  <rect x="655" y="188" width="420" height="7" rx="3.5"
        fill="#0A2B43"/>

  <rect x="655" y="188" width="0" height="7" rx="3.5"
        fill="url(#metric)">
    <animate
      attributeName="width"
      values="0;270;270"
      dur="2s"
      begin="0.3s"
      repeatCount="indefinite"/>
  </rect>


  <!-- MSE -->
  <text x="655" y="222"
        fill="#A8C6D4"
        font-family="Arial"
        font-size="11"
        font-weight="700">
    MSE
  </text>

  <text x="1070" y="222"
        fill="#5DEAFF"
        font-family="Arial"
        font-size="13"
        font-weight="700">
    8.76
  </text>

  <rect x="655" y="230" width="420" height="7" rx="3.5"
        fill="#0A2B43"/>

  <rect x="655" y="230" width="0" height="7" rx="3.5"
        fill="url(#metric)">
    <animate
      attributeName="width"
      values="0;245;245"
      dur="2s"
      begin="0.6s"
      repeatCount="indefinite"/>
  </rect>


  <!-- RMSE -->
  <text x="655" y="264"
        fill="#A8C6D4"
        font-family="Arial"
        font-size="11"
        font-weight="700">
    RMSE
  </text>

  <text x="1070" y="264"
        fill="#3BE38A"
        font-family="Arial"
        font-size="13"
        font-weight="700">
    2.96
  </text>

  <rect x="655" y="272" width="420" height="7" rx="3.5"
        fill="#0A2B43"/>

  <rect x="655" y="272" width="0" height="7" rx="3.5"
        fill="url(#metric)">
    <animate
      attributeName="width"
      values="0;300;300"
      dur="2s"
      begin="0.9s"
      repeatCount="indefinite"/>
  </rect>


  <!-- ===================================================== -->
  <!-- SCORE STATUS -->
  <!-- ===================================================== -->

  <rect x="655" y="305" width="420" height="48" rx="10"
        fill="#04182A"
        stroke="#168FC4"
        stroke-opacity="0.3"/>

  <circle cx="680" cy="329" r="7"
          fill="#3BE38A"
          filter="url(#glow)">

    <animate
      attributeName="r"
      values="6;9;6"
      dur="1.8s"
      repeatCount="indefinite"/>
  </circle>

  <text x="700" y="325"
        fill="#8FAFBE"
        font-family="Arial"
        font-size="10"
        font-weight="700">
    OVERALL PERFORMANCE
  </text>

  <text x="700" y="342"
        fill="#3BE38A"
        font-family="Arial"
        font-size="12"
        font-weight="700">
    GOOD FIT • LOW ERROR
  </text>


  <!-- ===================================================== -->
  <!-- MOVING SCAN LINE -->
  <!-- ===================================================== -->

  <rect x="640" y="55" width="2" height="310"
        fill="#5DEAFF"
        opacity="0.12">

    <animate
      attributeName="x"
      values="640;1125;640"
      dur="6s"
      repeatCount="indefinite"/>
  </rect>


  <!-- ===================================================== -->
  <!-- FRAME -->
  <!-- ===================================================== -->

  <rect x="1" y="1" width="1198" height="418" rx="23"
        stroke="#168FC4"
        stroke-opacity="0.35"/>

</svg>
